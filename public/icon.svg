<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Clean white background with rounded corners -->
  <rect width="512" height="512" rx="100" fill="#ffffff" />
  
  <!-- Back tilted card -->
  <g transform="translate(305, 275) rotate(22)">
    <rect x="-105" y="-155" width="210" height="310" rx="32" fill="#ffffff" stroke="#000000" stroke-width="26" stroke-linejoin="round" />
  </g>
  
  <!-- Front upright card with Heart -->
  <g transform="translate(195, 235)">
    <rect x="-115" y="-165" width="230" height="330" rx="34" fill="#ffffff" stroke="#000000" stroke-width="26" stroke-linejoin="round" />
    
    <!-- Bold Black Heart Icon -->
    <path d="M 0 52
             C -45 12 -75 -18 -75 -58
             C -75 -88 -52 -110 -22 -110
             C -7 -110 0 -96 0 -90
             C 0 -96 7 -110 22 -110
             C 52 -110 75 -88 75 -58
             C 75 -18 45 12 0 52 Z"
          fill="#000000" />
  </g>
</svg>
