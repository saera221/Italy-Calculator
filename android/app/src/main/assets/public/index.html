    <script>
      (function() {
        try {
          var saved = localStorage.getItem('italy_game_theme');
          var isDark = saved ? (saved === 'dark') : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (isDark) {
            document.documentElement.classList.add('dark');
            if (meta) meta.setAttribute('content', '#080c14');
          } else {
            document.documentElement.classList.remove('dark');
            if (meta) meta.setAttribute('content', '#f1f5f9');
          }
        } catch (e) {}
      })();
